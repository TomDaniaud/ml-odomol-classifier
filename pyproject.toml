[project]
name = "bandlab-ml-voice-declipper"
version = "0.1.0"
description = "Research repository for a tool that BandLab users can easily apply to their vocal recordings to remove clipping."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "hydra-core>=1.3.2",
    "ipywidgets>=8.1.9",
    "iterative-stratification>=0.1.9",
    "lightning>=2.6.1",
    "matplotlib>=3.11.2",
    "omegaconf>=2.3.0",
    "rdkit>=2026.9.1",
    "rich>=14.3.3",
    "rootutils>=1.0.7",
    "soundfile>=0.13.1",
    "soxr>=1.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchmetrics>=1.8.2",
    "unimol-tools>=0.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # naming conventions
    "N",
]

[tool.ty.environment]
root = ["./src"]
python = ".venv"

# ---------------------------------------------------------------------------
# Configuration UV pour l'accélération matérielle Intel Arc / XPU
# ---------------------------------------------------------------------------
# Sur Windows, redirige le téléchargement de PyTorch vers le dépôt officiel de roues XPU
# (Intel oneAPI Level-Zero / SYCL). L'utilisation du marqueur `sys_platform == 'win32'`
# assure que les environnements macOS (Apple Silicon MPS) et Linux (CUDA) continuent
# d'installer leurs dépendances standards sans conflit.
[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = false

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
]
triton-xpu = [
    { index = "pytorch-xpu", marker = "sys_platform == 'win32'" },
]



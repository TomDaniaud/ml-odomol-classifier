# @package _global_

defaults:
  - /tags: default
  - override /trainer: default
  - override /model: odomol
  - override /data: conformer
  - override /callbacks: default

rn: "scaffold-split"  #alias for rapid naming
run_name: "${rn}-${now:%m-%d_%H-%M-%S}" #run name formatting
subgroup: scaffold  #directory to write logs
description: "Entraînement avec split par scaffold Bemis-Murcko pour empêcher la fuite de familles chimiques"

seed: 64
float32_matmul_precision: high

trainer:
  max_epochs: 50
  accumulate_grad_batches: 8
  gradient_clip_val: 1.0
  precision: 32-true
  

data:
  split_type: scaffold
  batch_size: 8
  persistent_workers: True
  num_workers: 4

model:
  net:
    dropout: 0.4

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
    foreach: false

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 1e-6

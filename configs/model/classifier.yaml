_target_: src.models.netmodule.ClassifierLightningModule
nb_labels: 138

net:
  _target_: src.models.components.head.ClassificationHead
  in_channels: 512
  hidden_channels: 256
  out_channels: ${model.nb_labels}
  dropout: 0.2

criterion:
  _target_: torch.nn.BCEWithLogitsLoss

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0


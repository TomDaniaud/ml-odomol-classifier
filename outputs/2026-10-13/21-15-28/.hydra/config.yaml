task_name: train
run_name: first
description: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
seed: 64
data:
  _target_: src.data.datamodule.ExampleDataModule
  dataset_class:
    _partial_: true
    _target_: src.data.components.smiles_odor_dataset.SmilesOdorDataset
    data_dir: ${paths.root_dir}/data/smiles_odor_dataset.csv
    strict_validation: false
  batch_size: 64
  train_val_test_split:
  - 0.8
  - 0.1
  - 0.1
  num_workers: 0
  pin_memory: false
  seed: ${seed}
model:
  _target_: src.models.example_module.ExampleLightningModule
  net:
    _target_: src.models.components.identity_net.IdentityNet
    num_channels: ${data.dataset_class.num_channels}
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.002
    weight_decay: 0.0
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.1
    patience: 10
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch_{epoch:03d}
    monitor: valid/loss
    verbose: false
    save_last: true
    save_top_k: 5
    mode: min
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
  logged_rich_model_summary:
    _target_: src.callbacks.logged_rich_model_summary.LoggedRichModelSummary
    max_depth: -1
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  on_exception_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints
    filename: EXCEPTION_epoch_{epoch:03d}
loggers:
  tensorboard:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${paths.log_dir}/tensorboard
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  max_epochs: 10
  precision: 16-mixed
  check_val_every_n_epoch: 1
  enable_model_summary: false
  deterministic: false
  gradient_clip_val: 1.0
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: /mnt/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
tags:
  tensorboard.note.content: ${description}
  user: ${local_username:}
float32_matmul_precision: high

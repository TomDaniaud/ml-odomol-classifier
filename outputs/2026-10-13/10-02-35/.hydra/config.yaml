task_name: train
experiment_name: Voice Declipping
run_name: null
description: null
seed: 64
data:
  _target_: src.data.example_datamodule.ExampleDataModule
  dataset_class:
    _partial_: true
    _target_: src.data.components.audio_file_dataset.AudioFileDataset
    data_dir: ${paths.data_dir}/VoiceEnhancer
    supported_file_extensions:
    - wav
    - flac
    audio_duration: 2
    sample_rate: 44100
    num_channels: 2
  batch_size: null
  train_val_test_split:
  - 0.9
  - 0.05
  - 0.05
  num_workers: 16
  pin_memory: true
  seed: ${seed}
model:
  _target_: src.models.example_module.ExampleLightningModule
  net:
    _target_: src.models.components.identity_net.IdentityNet
    num_channels: 16
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.1
    patience: 10
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch_{epoch:03d}
    monitor: valid/loss
    verbose: false
    save_last: true
    save_top_k: 5
    mode: min
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
  logged_rich_model_summary:
    _target_: src.callbacks.logged_rich_model_summary.LoggedRichModelSummary
    max_depth: -1
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  on_exception_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints
    filename: EXCEPTION_epoch_{epoch:03d}
loggers:
  tensorboard:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    experiment_name: ???
    run_name: ???
    tags: ???
    prefix: ''
    artifact_location: null
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  max_epochs: 10
  precision: 16-mixed
  check_val_every_n_epoch: 1
  enable_model_summary: false
  deterministic: false
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: /mnt/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
